name = "lowkal-audio-sync"
main = "workers/audio-workflow.js"
compatibility_date = "2026-09-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[workflows]]
name = "lowkal-audio-copy"
binding = "AUDIO_SYNC"
class_name = "AudioSyncWorkflow"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "lowkal-audio"

[observability]
enabled = true

[[ratelimits]]
name = "LISTEN_RATE_LIMITER"
namespace_id = "737001"
simple = { limit = 60, period = 60 }
